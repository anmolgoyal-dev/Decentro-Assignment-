version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: expense_sharing_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: decentro
      POSTGRES_PASSWORD: decentro123
      POSTGRES_DB: expense_sharing_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decentro -d expense_sharing_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expense_sharing_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://decentro:decentro123@db:5432/expense_sharing_db
      - DEBUG=False
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
